name: Release binaries for avkiller

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Patch jconfigint.h for MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = "vendor/mozjpeg/config/jconfigint.h"
          $content = Get-Content $file -Raw

          # 1) INLINE
          $content = $content -replace '#define INLINE\s+__inline__ __attribute__\(\(always_inline\)\)', '#define INLINE  __forceinline'

          # 2) SIZEOF_SIZE_T
          $content = $content -replace '(?m)^#define SIZEOF_SIZE_T\s+__SIZEOF_SIZE_T__\s*$', @'
          #if defined(_MSC_VER)
          #define SIZEOF_SIZE_T  sizeof(size_t)
          #else
          #define SIZEOF_SIZE_T  __SIZEOF_SIZE_T__
          #endif
          '@.Trim()

          # 3) HAVE_BUILTIN_CTZL 的守卫
          $content = $content -replace '(?m)^#if __SIZEOF_LONG__ == __SIZEOF_SIZE_T__\s*$', @'
          #if !defined(_MSC_VER) && defined(__SIZEOF_LONG__) && defined(__SIZEOF_SIZE_T__) && \
          __SIZEOF_LONG__ == __SIZEOF_SIZE_T__
          '@.Trim()

          # 校验
          if ($content -notmatch '__forceinline') { Write-Error "INLINE patch failed"; exit 1 }
          if ($content -notmatch 'sizeof\(size_t\)') { Write-Error "SIZEOF_SIZE_T patch failed"; exit 1 }
          if ($content -notmatch '!defined\(_MSC_VER\)') { Write-Error "HAVE_BUILTIN_CTZL patch failed"; exit 1 }

          Set-Content $file $content -NoNewline
          Select-String -Path $file -Pattern 'INLINE|SIZEOF_SIZE_T|HAVE_BUILTIN_CTZL' -Context 0,1
          Set-Content $file $content -NoNewline
          # 打印结果确认替换生效
          Select-String -Path $file -Pattern 'INLINE'
      - name: Build and test
        run: |
          cargo build --release --locked --package pngdeer --target "$TARGET"
          cargo test --release --locked --package pngdeer --target "$TARGET"
      - name: Package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pngdeer"))')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml version v$version" >&2
            exit 1
          fi
          mkdir -p dist package
          cp "target/$TARGET/release/pngdeer" LICENSE package/
          python3 scripts/release-notices.py --target "$TARGET" --output package/THIRD_PARTY_LICENSES.txt
          archive="pngdeer-$version-$TARGET.tar.gz"
          tar -czf "dist/$archive" -C package pngdeer LICENSE THIRD_PARTY_LICENSES.txt
          mkdir smoke
          tar -xzf "dist/$archive" -C smoke
          smoke/pngdeer bench/images/icons/twemoji-1f4a1.png -o smoke/output.png
          smoke/pngdeer bench/images/icons/twemoji-1f4a1.png --score smoke/output.png
          test -s smoke/output.png
      - uses: actions/upload-artifact@v6
        with:
          name: pngdeer-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
